name: QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias y Cobertura (Jest)
        run: npm run test:unit

      - name: Guardar Artefacto de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Instalar Navegadores Playwright
        run: npx playwright install --with-deps

      - name: Compilar Proyecto
        run: npm run build

      - name: Ejecutar Pruebas E2E y Generar Allure
        run: |
          npx playwright test || true
          npx allure generate allure-results --clean -o allure-report || true

      - name: Guardar Reporte Allure como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-dashboard
          path: allure-report/

  security-scan:
    name: Security Scan (Auditoría SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm Audit (Seguridad de Dependencias)
        run: npm audit --audit-level=high || true